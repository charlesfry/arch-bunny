# The ChromeOS EC charge-control driver refuses to probe on Framework laptops
# by default, because the EC exposes its own charge limit too. Opting in gives
# the standard sysfs charge_control_end_threshold that bunny-toggle-charge-limit
# writes, instead of needing fw-ectool from the AUR.
options cros_charge-control probe_with_fwk_charge_control=1
