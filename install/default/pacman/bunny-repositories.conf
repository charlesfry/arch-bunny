# Managed by the dotfiles installer.
# The Omarchy signing key is pinned and locally signed by 10-packages.sh before
# this repository is first synchronized; fingerprint
# 40DFB630FF42BCFFB047046CF0134EE680CAC571 (Omarchy <pkgs@omarchy.org>), published
# at https://learn.omacom.io/2/the-omarchy-manual/93/security.
#
# DatabaseOptional, not Required: the repository serves omarchy.db but no
# omarchy.db.sig (404 as of 2026-09), so requiring a database signature would
# make every sync fail. Packages themselves are all signed and are verified.
[omarchy]
SigLevel = Required DatabaseOptional
Server = https://pkgs.omarchy.org/stable/$arch
