# Launcher styling. Large, soothing metal-blue, translucent.
font=SpaceMono Nerd Font:size=16
dpi-aware=no
prompt="  "
terminal=kitty -e
layer=overlay
width=64
lines=18
line-height=32
horizontal-pad=32
vertical-pad=28
inner-pad=14
icon-theme=Adwaita
image-size-ratio=0.4

[colors]
background=1e2a38ee
text=d6e2f0ff
prompt=8fb3d9ff
placeholder=7d8fa3ff
input=eaf2ffff
match=9dc7f5ff
selection=32506ee6
selection-text=f2f8ffff
selection-match=b6dcffff
border=6f93b8cc

[border]
width=2
radius=14
