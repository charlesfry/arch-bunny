# Launcher styling. Large, neon violet/pink, translucent.
font=SpaceMono Nerd Font:size=16
dpi-aware=no
prompt="  "
terminal=kitty -e
layer=overlay
width=64
lines=14
line-height=32
horizontal-pad=32
vertical-pad=28
inner-pad=14
icon-theme=Adwaita
image-size-ratio=0.4

[colors]
background=0d0e17ee
text=e8ecffff
prompt=ff4fd8ff
placeholder=7d89b8ff
input=eef0ffff
match=ff4fd8ff
selection=8f1a558f
selection-text=eef0ffff
selection-match=ff8de8ff
border=ff4fd8ff

[border]
width=2
radius=14
