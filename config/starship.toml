"$schema" = 'https://starship.rs/config-schema.json'

format = """
$fill\
$line_break\
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$conda\
$python\
$character"""

[directory]
style = "bright-white"
truncation_length = 0
truncate_to_repo = false

[character]
success_symbol = "[🥕](bright-black)"
error_symbol   = "[χ](red)"
vimcmd_symbol  = "[∷](green)"

[fill]
symbol = "─"
style = "#212831"

[git_branch]
symbol = ""
format = "[$symbol $branch]($style)"
style = "#88929f"

[git_status]
format = " [$ahead_behind$stashed $all_status]($style) "
style = "green"

# Single-letter lowercase symbols for git status
conflicted = "χ"
staged     = "^"
modified   = "*"
untracked  = "u"
renamed    = "r"
deleted    = "d"
stashed    = "s"
ahead      = "↑"
behind     = "↓"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "yellow"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[conda]
format = "[$symbol$environment]($style) "
style = "#a259ff"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"
detect_extensions = []
detect_files = []
