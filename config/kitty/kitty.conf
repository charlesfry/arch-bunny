font_family SpaceMono Nerd Font Mono
font_size 18
disable_ligatures always

# Neon-navy palette, matches mako/waybar. ANSI slots also drive starship's
# named styles (bright-white, bright-black, red, green, yellow), so this is
# the one place that has to change for both prompts to stay in sync.
foreground #e8ecff
background #0d0e17
cursor #4fd8ff
selection_background #212831
selection_foreground #e8ecff

color0  #0d0e17
color1  #ff5d7a
color2  #4fffa8
color3  #ffd24f
color4  #4fd8ff
color5  #ff4fd8
color6  #5ceaff
color7  #7d89b8
color8  #5c6370
color9  #ff7a92
color10 #7affc4
color11 #ffe28a
color12 #7de4ff
color13 #ff8de8
color14 #8ff0ff
color15 #e8ecff

# author 2026-08-24: no close confirmation — "i click close because i'm sure."
# Trade accepted: closing an OS window kills running processes without asking.
confirm_os_window_close 0
