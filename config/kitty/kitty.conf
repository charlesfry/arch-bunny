font_family SpaceMono Nerd Font Mono
font_size 18
disable_ligatures always

# author 2026-08-24: no close confirmation — "i click close because i'm sure."
# Trade accepted: closing an OS window kills running processes without asking.
confirm_os_window_close 0

# Universal copy/paste. Ctrl+C and Ctrl+V already mean copy and paste in every
# GUI app; the terminal was the one place they did not, which is what made
# Ctrl+Shift+C a thing to remember. This makes the gesture the same everywhere.
#
# copy_and_clear_or_interrupt copies only when there is a selection, and clears
# the selection as it does, so the very next Ctrl+C is an interrupt again. With
# nothing selected it is an ordinary SIGINT.
#
# Trade accepted: Ctrl+V no longer reaches readline's quoted-insert. Ctrl+Shift+V
# still pastes, and Ctrl+Shift+C still copies, so nothing that worked before is gone.
map ctrl+c copy_and_clear_or_interrupt
map ctrl+v paste_from_clipboard
