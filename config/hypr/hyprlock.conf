# Background color
$color = rgba(40, 44, 52, 1.0)

# Inner overlay color
$inner_color = rgba(0, 0, 0, 0.0)

# Outer border/accent color
$outer_color = rgba(79, 216, 255, 1.0)

# Font color (main foreground)
$font_color = rgba(232, 236, 255, 1.0)

# Checkmark/success color (neon green accent)
$check_color = rgba(79, 255, 168, 1.0)

# Clock color
$clock_color = rgba(232, 236, 255, 1.0)

# Font
$font = Noto Sans Mono, Symbols Nerd Font Mono, monospace

general {
  ignore_empty_input = true
}

background {
  monitor =
  color = $color
  path = ~/background.jpg
  blur_passes = 3
}

animations {
  enabled = false
}

label {
  monitor =
  text = $TIME
  font_size = 80
  color = $clock_color
  font_family = $font
  position = 0, 70
}

label {
  monitor =
  text = cmd[update:60000] date +"%a,  %d  %b"
  font_size = 16
  color = $font_color
  font_family = $font
  position = 0, 10
  halign = center
  valign = center
}

# Battery indicator in the upper-right corner.
label {
  monitor =
  text = cmd[update:30000] sh -c 'capacity=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1); [ -n "$capacity" ] || exit 0; status=$(cat /sys/class/power_supply/BAT*/status | head -n1); if [ "$status" = Charging ]; then printf "󰂅"; elif [ "$capacity" -ge 90 ]; then printf "󰁹"; elif [ "$capacity" -ge 80 ]; then printf "󰂂"; elif [ "$capacity" -ge 70 ]; then printf "󰂁"; elif [ "$capacity" -ge 60 ]; then printf "󰂀"; elif [ "$capacity" -ge 50 ]; then printf "󰁿"; elif [ "$capacity" -ge 40 ]; then printf "󰁾"; elif [ "$capacity" -ge 30 ]; then printf "󰁽"; elif [ "$capacity" -ge 20 ]; then printf "󰁼"; else printf "󰁺"; fi'
  font_size = 16
  font_family = $font
  color = $font_color
  position = -32, -26
  halign = right
  valign = top
}

input-field {
  monitor =
  size = 520, 70
  position = 0, -45
  halign = center
  valign = center

  inner_color = $inner_color
  outer_color = $outer_color
  outline_thickness = 1

  font_family = $font
  font_color = $font_color

  dots_size = 0.2

  placeholder_text = Enter password...
  check_color = $check_color
  fail_color = rgba(255, 93, 122, 1.0)
  fail_text = <i>$FAIL ($ATTEMPTS)</i>

  rounding = 6
  shadow_passes = 0
  fade_on_empty = true
}

auth {
  fingerprint:enabled = true
}
